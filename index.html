<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio — 1974 to 2026</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="page">
    <aside class="sidebar">
      <nav class="nav" aria-label="주 메뉴"><a class="brand" href="#top">Gustavo Faria</a><a href="#info">Info</a><a href="https://instagram.com/" target="_blank" rel="noopener noreferrer">Instagram</a></nav>
      <div id="info" class="bio"><h3>I was born in 1974.<br>Born in Daegu, Living in Yeongcheon,<br>Gyeongsangbuk-do Province<br>Middle School Information and Computer Teacher.<br>Dreaming of becoming a big data analytics expert.</h3></div>

        </div>
